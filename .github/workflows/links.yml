name: Maintenance des liens Pokemon
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
concurrency:
  group: pokemon-link-catalog
  cancel-in-progress: false
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Decouvrir et verifier les liens
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python link_agent.py
      - name: Sauvegarder le catalogue sans donnees personnelles
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/links.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Pokemon product link catalog'
            git push
          fi
